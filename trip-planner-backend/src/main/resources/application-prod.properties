# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=${PORT:8089}
server.forward-headers-strategy=native

# ==========================================
# FRONTEND  AND CORS
# ==========================================
app.frontend.url=${APP_FRONTEND_URL}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ==========================================
# AIVEN MYSQL DATABASE
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA AND HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# GOOGLE OAUTH2
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ==========================================
# GEMINI AI
# ==========================================
google.gemini.api.key=${GEMINI_API_KEY}
google.gemini.model=${GOOGLE_GEMINI_MODEL:gemini-2.5-flash}

# ==========================================
# WEATHER API
# ==========================================
weather.openweather.api-key=${OPENWEATHER_API_KEY}

# ==========================================
# FILE UPLOADS AND BACKEND URL
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${APP_UPLOAD_DIR:/tmp/trip-planner-uploads}
app.backend.url=${APP_BACKEND_URL:https://trip-planner-1523.onrender.com}

# ==========================================
# AWS S3 PROFILE PICTURE STORAGE
# ==========================================
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:}
aws.s3.use-presigned-url=${AWS_S3_USE_PRESIGNED_URL:true}

# ==========================================
# NOMINATIM AND GLOBAL GEOCODING
# ==========================================
geocoding.nominatim.enabled=${GEOCODING_NOMINATIM_ENABLED:true}
geocoding.google.enabled=${GEOCODING_GOOGLE_ENABLED:true}
geocoding.here.enabled=${GEOCODING_HERE_ENABLED:true}
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
here.api-key=${HERE_API_KEY:}
geocoding.nominatim.contact-email=${NOMINATIM_CONTACT_EMAIL}
geocoding.nominatim.user-agent=${NOMINATIM_USER_AGENT:TripPlanner/1.0}
geocoding.city-cache-ttl=${GEOCODING_CITY_CACHE_TTL:30d}

# ==========================================
# SMTP EMAIL
# ==========================================
BREVO_API_KEY=${BREVO_API_KEY:}
BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL:tripplanner738@gmail.com}
BREVO_FROM_NAME=${BREVO_FROM_NAME:TripPlanner}
# ==========================================
# SESSION COOKIE CONFIGURATION
# ==========================================
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.max-age=604800s
server.servlet.session.timeout=604800s

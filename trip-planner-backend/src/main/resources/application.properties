```properties
# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=${PORT:8080}
server.forward-headers-strategy=native

# ==========================================
# FRONTEND AND CORS
# ==========================================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==========================================
# DATABASE - MYSQL
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trip_planner}?sslMode=${DB_SSL_MODE:DISABLED}&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA AND HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# GOOGLE OAUTH2
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ==========================================
# GEMINI AI
# ==========================================
google.gemini.api.key=${GEMINI_API_KEY:}
google.gemini.model=${GOOGLE_GEMINI_MODEL:gemini-2.5-flash}

# ==========================================
# WEATHER API
# ==========================================
weather.openweather.api-key=${OPENWEATHER_API_KEY:}

# ==========================================
# FILE UPLOADS
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# ==========================================
# SMTP EMAIL
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# SESSION CONFIGURATION
# ==========================================
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m
```
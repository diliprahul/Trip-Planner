server.port=${PORT:8089}

spring.datasource.url=jdbc:h2:mem:trip_planner;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

google.gemini.api.key=${GEMINI_API_KEY:}
google.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
weather.openweather.api-key=${OPENWEATHER_API_KEY}

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
